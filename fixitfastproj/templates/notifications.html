{% extends base_template %}
{% block title %}Notifications · FixItFast{% endblock %}

{% block content %}
<h1 class="h4 mb-3">Notifications</h1>
<div class="list-group shadow-sm">
  {% for item in items %}
    <a class="list-group-item list-group-item-action d-flex justify-content-between gap-3 {% if not item.is_read %}fw-semibold{% endif %}"
       href="{% url request.resolver_match.namespace|add:':open_notification' item.pk %}">
      <span>{% if not item.is_read %}<i class="bi bi-dot text-primary"></i>{% endif %}{{ item.message }}</span>
      <span class="small text-secondary text-nowrap">{{ item.created_at|timesince }} ago</span>
    </a>
  {% empty %}
    <div class="list-group-item text-secondary">No notifications yet.</div>
  {% endfor %}
</div>
{% endblock %}
